name: Native Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Static token limits, rather than only a cache action's save-if, enforce the
# trust boundary even if repository code tries to use the cache API directly.
cache-mode: read

jobs:
  ci:
    if: github.event_name != 'push'
    cache-mode: read
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: true

  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: true
      save-cache: true

  tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    cache-mode: none
    uses: ./.github/workflows/native-build.yml
    with:
      use-cache: false
      release: true

  # Tagging v* publishes a draft release carrying both architectures. It is
  # left as a draft for release-note and asset review. Notes distinguish unsigned
  # Store submission MSIX files from installers. The updater sees a release only
  # after the draft is published as stable.
  release:
    name: Draft release
    cache-mode: none
    needs: tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: Reminders-for-Windows-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Check both architectures are present
        run: |
          set -euo pipefail
          for file in \
            "Reminders-for-Windows-x64-Setup.exe" \
            "Reminders-for-Windows-arm64-Setup.exe" \
            "Reminders-for-Windows-x64.zip" \
            "Reminders-for-Windows-arm64.zip" \
            "Reminders-for-Windows-x64.msix" \
            "Reminders-for-Windows-ARM64.msix"; do
            found=$(find artifacts -name "$file" -size +0c | head -1)
            if [ -z "$found" ]; then
              echo "Missing or empty artifact: $file" >&2
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Reminders for Windows ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*-Setup.exe
            artifacts/**/*.zip
            artifacts/**/*.msix
          fail_on_unmatched_files: true
          body: |
            ## Signing in

            Choose **Sign in with an Apple device** to use Apple's hosted
            sign-in page and the verification methods available for your
            account. After verification, the window returns to the native app;
            use **Continue in app** if it stays open. Choose **Trust** when
            Apple offers it to remember this PC. Apple can still expire or
            revoke the saved session.

            Native email/password sign-in also supports **Text me a code**.
            App-specific passwords do not authenticate this Reminders service.

            ## Installing

            Download **Reminders-for-Windows-x64-Setup.exe** (or `arm64` on an
            Arm device) and run it. It installs for the current user, so there
            is no admin prompt.

            These builds are not code-signed, so Windows SmartScreen will warn
            the first time. Choose **More info**, then **Run anyway**.

            Prefer not to install? `Reminders-for-Windows-x64.zip` is the same
            application as a portable folder -- unzip it and run `Reminders.exe`.
            Keep the publish folder together, including `Reminders.Core.dll`.

            **Reminders-for-Windows-x64.msix** and
            **Reminders-for-Windows-ARM64.msix** are unsigned Store submission
            packages for Partner Center certification and signing. Store
            publication does not sign these separate GitHub files. Install from
            the Microsoft Store listing for a Store-signed package.
