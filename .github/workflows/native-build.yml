name: Native Windows pipeline

on:
  workflow_call:
    inputs:
      use-cache:
        type: boolean
        required: true
      save-cache:
        type: boolean
        default: false
      release:
        type: boolean
        default: false

# Cache access is capped by the caller: read for PRs/manual builds, write
# for main pushes, none for tags. Do not override that boundary here.
permissions:
  contents: read

jobs:
  backend-checks:
    name: C# backend tests
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.release && '0' || '1' }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Check versions and release ancestry
        run: |
          $csproj = [xml](Get-Content src/Reminders.WinUI/Reminders.WinUI.csproj)
          $app = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }).Trim()
          $manifest = [xml](Get-Content src/Reminders.Package/Package.appxmanifest)
          if ($manifest.Package.Identity.Version -ne "$app.0") { throw 'The MSIX and app versions must agree.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            if ($env:GITHUB_REF_NAME.Substring(1) -ne $app) { throw "Tag version does not match app version $app." }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
          }

      - name: Test C# backend
        run: |
          dotnet restore tests/Reminders.Core.Tests/Reminders.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Backend locked restore failed.' }
          dotnet run --project tests/Reminders.Core.Tests/Reminders.Core.Tests.csproj -c Release --no-restore

  audit:
    name: Check CI trust boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check cache and release trust boundaries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r scripts/ci-policy-requirements.txt
          python scripts/test_ci_policy.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            artifact: x64
            portable_dir: dist-windows
          - architecture: ARM64
            artifact: arm64
            portable_dir: dist-windows-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        if: inputs.use-cache
        id: nuget
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nuget/packages
          key: ci-v1-nuget-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles(format('src/Reminders.WinUI/packages.{0}.lock.json', matrix.architecture == 'ARM64' && 'win-arm64' || 'win-x64'), 'src/Reminders.WinUI/Reminders.WinUI.csproj', 'src/Reminders.Core/Reminders.Core.csproj', 'src/Reminders.Core/packages.lock.json') }}

      - name: Build and publish native app
        run: .\scripts\build-windows.ps1 -Configuration Release -Architecture ${{ matrix.architecture }} -LockedRestore

      - name: Test update release selection and download verification
        run: dotnet run --project tests/AppUpdater.Tests/AppUpdater.Tests.csproj -c Release

      - name: Save NuGet packages from main
        if: inputs.save-cache && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Build Microsoft Store submission MSIX
        run: .\scripts\build-msix.ps1 -Architecture ${{ matrix.architecture }} -Store -SkipBuild

      - name: Test packaged x64 launch
        if: matrix.architecture == 'x64'
        run: |
          # Loose registration of an unsigned submission requires Developer Mode.
          $developerMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $developerMode -Force | Out-Null
          New-ItemProperty -Path $developerMode -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
          .\scripts\test-msix-launch.ps1 -PackagePath dist-store/Reminders-for-Windows-x64.msix

      # The .exe installer is the artifact users can actually install. An
      # unsigned MSIX is refused outright by Windows -- the Install button is
      # disabled -- whereas an unsigned .exe only draws a SmartScreen warning
      # the user can dismiss. The MSIX uses the assigned Store identity and
      # is submitted to Partner Center for Microsoft signing.
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          else {
            Write-Host 'Inno Setup is already present on the runner.'
          }

      - name: Build installer
        run: .\scripts\build-installer.ps1 -Architecture ${{ matrix.architecture }} -SkipBuild

      - name: Verify published artifacts
        run: |
          $arch = "${{ matrix.architecture }}"
          $lower = if ($arch -eq 'ARM64') { 'arm64' } else { 'x64' }
          $expected = @(
            "${{ matrix.portable_dir }}/Reminders.exe",
            "${{ matrix.portable_dir }}/Reminders.Core.dll",
            "dist-store/Reminders-for-Windows-$arch.msix",
            "dist-installer/Reminders-for-Windows-$lower-Setup.exe"
          )
          foreach ($path in $expected) {
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($item.Length -eq 0) { throw "Published artifact is empty: $path" }
            Write-Host ("{0,-64} {1,10:N0} bytes" -f $item.Name, $item.Length)
          }

      - name: Package portable build
        run: Compress-Archive -Path "${{ matrix.portable_dir }}/*" -DestinationPath "Reminders-for-Windows-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Reminders-for-Windows-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist-installer/Reminders-for-Windows-${{ matrix.artifact }}-Setup.exe
            Reminders-for-Windows-${{ matrix.artifact }}.zip
            dist-store/Reminders-for-Windows-${{ matrix.architecture }}.msix
          if-no-files-found: error
          compression-level: 0
